name: zapisz-stany
on:
  schedule:
    - cron: "17 * * * *"   # co godzinę (strona aktualizuje się co godzinę)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scrape.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.csv
          git diff --cached --quiet || git commit -m "stany $(date -u +%F_%H%M)"
          git push
